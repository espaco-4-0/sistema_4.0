name: Base branch

on:
    pull_request_target:
        types: [opened, edited, reopened, synchronize]

permissions:
    pull-requests: write

jobs:
    check-base:
        name: Conferir branch de destino
        runs-on: ubuntu-latest
        # `develop` é a branch de integração. Só release/* e hotfix/* podem ir para main.
        if: github.base_ref == 'main'

        steps:
            - name: Bloquear PR indevido para a main
              if: ${{ !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'hotfix/') }}
              uses: actions/github-script@v7
              with:
                  script: |
                      const head = context.payload.pull_request.head.ref;

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body: [
                          '### PR apontando para a `main`',
                          '',
                          `A branch \`${head}\` não pode ser mesclada diretamente na \`main\`.`,
                          '',
                          'O fluxo do projeto é:',
                          '',
                          '- toda feature/fix vai para **`develop`**;',
                          '- só `release/*` e `hotfix/*` sobem de `develop` para `main`.',
                          '',
                          'Troque a base deste PR para `develop` (botão **Edit** ao lado do título) e este check passa automaticamente.',
                        ].join('\n'),
                      });

                      core.setFailed(`PR de '${head}' para 'main' não é permitido. Use 'develop' como base.`);
