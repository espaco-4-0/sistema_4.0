packages:
  - .
allowBuilds:
  '@prisma/engines': true
  core-js-pure: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  '@hono/node-server@<1.19.10': '>=1.19.10'
  '@hono/node-server@<1.19.13': '>=1.19.13'
  axios@>=1.0.0 <1.15.2: '>=1.15.2'
  # O alvo precisa ficar preso ao 1.x: minimatch@3 depende de `^1.1.7` e a API
  # mudou no 5.x (deixou de exportar a função por default), o que quebrava o ESLint
  # com "expand is not a function". 1.1.16 é a linha de manutenção já corrigida.
  brace-expansion@<1.1.13: '>=1.1.16 <2'
  brace-expansion@>=4.0.0 <5.0.5: '>=5.0.5'
  defu@<=6.1.4: '>=6.1.5'
  effect@<3.20.0: '>=3.20.0'
  hono@<4.11.10: '>=4.11.10'
  hono@<4.11.7: '>=4.11.7'
  hono@<4.12.12: '>=4.12.12'
  hono@<4.12.4: '>=4.12.4'
  hono@<4.12.7: '>=4.12.7'
  hono@>=4.0.0 <=4.12.11: '>=4.12.12'
  ip-address@<=10.1.0: '>=10.1.1'
  lodash-es@<=4.17.23: '>=4.18.0'
  lodash-es@>=4.0.0 <=4.17.23: '>=4.18.0'
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  next@>=15.6.0-canary.0 <16.1.5: '>=16.1.5'
  next@>=16.0.0-beta.0 <16.1.5: '>=16.1.5'
  next@>=16.0.0-beta.0 <16.1.7: '>=16.1.7'
  next@>=16.0.0-beta.0 <16.2.3: '>=16.2.3'
  next@>=16.0.1 <16.1.7: '>=16.1.7'
  next@>=16.1.0-canary.0 <16.1.5: '>=16.1.5'
  nodemailer@<8.0.4: '>=8.0.4'
  nodemailer@<=8.0.4: '>=8.0.5'
  picomatch@<2.3.2: '>=2.3.2'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss@<8.5.10: '>=8.5.10'
  vite@>=8.0.0 <=8.0.4: '>=8.0.5'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
